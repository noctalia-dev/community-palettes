name: Automatic Palette Check
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "**/*.json"
permissions:
  contents: read
  pull-requests: write
jobs:
  palette-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          # This job only reads palette JSON; it never executes code from the PR.
          allow-unsafe-pr-checkout: true

      - name: Validate palette layout
        run: node .github/workflows/validate-layout.js

      - name: Automatic Palette Check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "$BASE_REF"

          if git diff --name-only --diff-filter=ACMRT origin/"$BASE_REF"...HEAD | grep -q '^registry\.json$'; then
            gh pr comment "$PR_NUMBER" --body "### Automatic Palette Check\nThis PR modifies \`registry.json\` directly. That file is auto-generated by the CI workflow and must never be edited manually. Please remove it from your PR."
            exit 1
          fi

          diff_changes=$(git diff -U10000 --name-only --diff-filter=ACMRT origin/"$BASE_REF"...HEAD | grep '\.json$' | grep -v 'registry\.json' || true)

          if [ -z "$diff_changes" ]; then
            echo "No json files changed!"
            echo "The base ref checking: $BASE_REF"
            echo "The head ref checking: $HEAD_REF"
            exit 0
          fi

          declare -A table

          # Key is the path to the json field, value is the type of field
          table["version"]="number"
          table["dark"]="object"
          table["dark.primary"]="string"
          table["dark.on_primary"]="string"
          table["dark.secondary"]="string"
          table["dark.on_secondary"]="string"
          table["dark.tertiary"]="string"
          table["dark.on_tertiary"]="string"
          table["dark.error"]="string"
          table["dark.on_error"]="string"
          table["dark.surface"]="string"
          table["dark.on_surface"]="string"
          table["dark.surface_container"]="string"
          table["dark.on_surface_variant"]="string"
          table["dark.outline_variant"]="string"
          table["dark.shadow"]="string"
          table["dark.hover"]="string"
          table["dark.on_hover"]="string"

          table["dark.terminal"]="object"
          table["dark.terminal.foreground"]="string"
          table["dark.terminal.background"]="string"
          table["dark.terminal.selection_fg"]="string"
          table["dark.terminal.selection_bg"]="string"
          table["dark.terminal.cursor_text"]="string"
          table["dark.terminal.cursor"]="string"

          table["dark.terminal.normal"]="object"
          table["dark.terminal.normal.black"]="string"
          table["dark.terminal.normal.red"]="string"
          table["dark.terminal.normal.green"]="string"
          table["dark.terminal.normal.yellow"]="string"
          table["dark.terminal.normal.blue"]="string"
          table["dark.terminal.normal.magenta"]="string"
          table["dark.terminal.normal.cyan"]="string"
          table["dark.terminal.normal.white"]="string"

          table["dark.terminal.bright"]="object"
          table["dark.terminal.bright.black"]="string"
          table["dark.terminal.bright.red"]="string"
          table["dark.terminal.bright.green"]="string"
          table["dark.terminal.bright.yellow"]="string"
          table["dark.terminal.bright.blue"]="string"
          table["dark.terminal.bright.magenta"]="string"
          table["dark.terminal.bright.cyan"]="string"
          table["dark.terminal.bright.white"]="string"

          table["light"]="object"
          table["light.primary"]="string"
          table["light.on_primary"]="string"
          table["light.secondary"]="string"
          table["light.on_secondary"]="string"
          table["light.tertiary"]="string"
          table["light.on_tertiary"]="string"
          table["light.error"]="string"
          table["light.on_error"]="string"
          table["light.surface"]="string"
          table["light.on_surface"]="string"
          table["light.surface_container"]="string"
          table["light.on_surface_variant"]="string"
          table["light.outline_variant"]="string"
          table["light.shadow"]="string"
          table["light.hover"]="string"
          table["light.on_hover"]="string"

          table["light.terminal"]="object"
          table["light.terminal.foreground"]="string"
          table["light.terminal.background"]="string"
          table["light.terminal.selection_fg"]="string"
          table["light.terminal.selection_bg"]="string"
          table["light.terminal.cursor_text"]="string"
          table["light.terminal.cursor"]="string"

          table["light.terminal.normal"]="object"
          table["light.terminal.normal.black"]="string"
          table["light.terminal.normal.red"]="string"
          table["light.terminal.normal.green"]="string"
          table["light.terminal.normal.yellow"]="string"
          table["light.terminal.normal.blue"]="string"
          table["light.terminal.normal.magenta"]="string"
          table["light.terminal.normal.cyan"]="string"
          table["light.terminal.normal.white"]="string"

          table["light.terminal.bright"]="object"
          table["light.terminal.bright.black"]="string"
          table["light.terminal.bright.red"]="string"
          table["light.terminal.bright.green"]="string"
          table["light.terminal.bright.yellow"]="string"
          table["light.terminal.bright.blue"]="string"
          table["light.terminal.bright.magenta"]="string"
          table["light.terminal.bright.cyan"]="string"
          table["light.terminal.bright.white"]="string"

          # Palette format 2 is the only accepted shape. Each unknown key is
          # emitted with its format 2 name when it is a format 1 name; the API
          # converts format 2 files back to format 1 for older Noctalia releases.
          cat >"$RUNNER_TEMP/unknown.jq" <<'UNKNOWN_JQ'
          def mode_keys: ["primary","on_primary","secondary","on_secondary","tertiary","on_tertiary","error","on_error","surface","on_surface","surface_container","on_surface_variant","outline_variant","shadow","hover","on_hover","terminal"];
          def terminal_keys: ["normal","bright","foreground","background","selection_fg","selection_bg","cursor_text","cursor"];
          def ansi_keys: ["black","red","green","yellow","blue","magenta","cyan","white"];
          def version1_names: {"mPrimary":"primary","mOnPrimary":"on_primary","mSecondary":"secondary","mOnSecondary":"on_secondary","mTertiary":"tertiary","mOnTertiary":"on_tertiary","mError":"error","mOnError":"on_error","mSurface":"surface","mOnSurface":"on_surface","mSurfaceVariant":"surface_container","mOnSurfaceVariant":"on_surface_variant","mOutline":"outline_variant","mShadow":"shadow","mHover":"hover","mOnHover":"on_hover","selectionFg":"selection_fg","selectionBg":"selection_bg","cursorText":"cursor_text"};
          def unknown($obj; $allowed; $prefix): if ($obj | type) == "object" then (($obj | keys) - $allowed)[] | "\($prefix)\(.)\t\(version1_names[.] // "")" else empty end;
          . as $palette
          | unknown($palette; ["version", "dark", "light"]; ""),
            ([ "dark", "light" ][] as $mode
             | unknown($palette[$mode]; mode_keys; "\($mode).")
             , unknown($palette[$mode].terminal?; terminal_keys; "\($mode).terminal.")
             , ([ "normal", "bright" ][] as $group | unknown($palette[$mode].terminal?[$group]?; ansi_keys; "\($mode).terminal.\($group).")))
          UNKNOWN_JQ

          # WCAG 2.1 relative-luminance contrast, used to check every on_x against
          # the x it is painted on. Emits one "ratio<TAB>mode<TAB>fg key<TAB>bg key<TAB>fg<TAB>bg"
          # line per pair. Pairs whose colors failed the #rrggbb check are skipped;
          # they are already reported above.
          cat >"$RUNNER_TEMP/contrast.jq" <<'CONTRAST_JQ'
          def hexbyte:
            explode
            | map(if . >= 48 and . <= 57 then . - 48 elif . >= 97 and . <= 102 then . - 87 else . - 55 end)
            | .[0] * 16 + .[1];

          def lin: (. / 255) | if . <= 0.04045 then . / 12.92 else pow((. + 0.055) / 1.055; 2.4) end;

          def luminance:
            ltrimstr("#") | ascii_downcase | [.[0:2], .[2:4], .[4:6]] | map(hexbyte)
            | 0.2126 * (.[0] | lin) + 0.7152 * (.[1] | lin) + 0.0722 * (.[2] | lin);

          def contrast($fg; $bg):
            ($fg | luminance) as $a
            | ($bg | luminance) as $b
            | (([$a, $b] | max) + 0.05) / (([$a, $b] | min) + 0.05);

          def is_color: type == "string" and test("^#[0-9a-fA-F]{6}$");

          . as $palette
          | [ "dark", "light" ][] as $mode
          | [ ["primary", "on_primary"], ["secondary", "on_secondary"], ["tertiary", "on_tertiary"], ["error", "on_error"], ["surface", "on_surface"], ["surface_container", "on_surface_variant"], ["hover", "on_hover"] ][] as [$bg_key, $fg_key]
          | ($palette[$mode] // {}) as $vars
          | $vars[$bg_key] as $bg
          | $vars[$fg_key] as $fg
          | select(($bg | is_color) and ($fg | is_color))
          | "\(contrast($fg; $bg) * 100 | round / 100)\t\($mode)\t\($fg_key)\t\($bg_key)\t\($fg)\t\($bg)"
          CONTRAST_JQ

          # Below this ratio the text is not legible on its background at any size.
          contrast_floor=2.0
          # Between the floor and this, it is legible but strained; reviewers decide.
          contrast_warn=3.0

          comment_body=$(printf -- '### Automatic Palette Check')

          issues=0
          warnings=0

          # PR Comment Title
          title_added=false
          file_title=""
          function check_file_title() {
            if [ "$title_added" = false ]; then
              title_added=true
              comment_body+="$file_title"
            fi
          }

          while IFS= read -r line; do
            # Check each file that it contains the necessary fields
            file=$line
            title_added=false
            file_title=$(printf -- '\n--- \n### File: %s' "$file")

            for key in "${!table[@]}"; do
              if ! jq ".$key | type" "$file" | grep "${table[${key}]}" >/dev/null; then
                check_file_title

                comment_body+=$(printf -- '\n- Missing required property `%s`' "$key")
                issues=$((issues + 1))
              fi
            done

            # A missing version is already reported by the table check above.
            version=$(jq -c '.version' "$file")
            if [ "$version" != "2" ] && [ "$version" != "null" ]; then
              check_file_title

              comment_body+=$(printf -- '\n- Unsupported `version` `%s`, expected `2`' "$version")
              issues=$((issues + 1))
            fi

            while IFS=$'\t' read -r unknown_key format2_name; do
              [ -z "$unknown_key" ] && continue
              check_file_title

              if [ -n "$format2_name" ]; then
                comment_body+=$(printf -- '\n- `%s` is the format 1 name; format 2 calls it `%s`' "$unknown_key" "$format2_name")
              else
                comment_body+=$(printf -- '\n- Unknown property `%s`' "$unknown_key")
              fi
              issues=$((issues + 1))
            done < <(jq -r -f "$RUNNER_TEMP/unknown.jq" "$file")

            # Every string leaf in a palette is a color, and Noctalia parses colors as
            # exactly six hex digits. Anything else (a name, a short hex, an alpha byte)
            # is dropped at load time and the role silently falls back.
            while IFS= read -r bad_color; do
              [ -z "$bad_color" ] && continue
              check_file_title

              comment_body+=$(printf -- '\n- Invalid color `%s`, expected `#rrggbb`' "$bad_color")
              issues=$((issues + 1))
            done < <(jq -r '
              paths(scalars) as $p
              | getpath($p) as $v
              | select(($v | type) == "string")
              | select($v | test("^#[0-9a-fA-F]{6}$") | not)
              | "\($p | join(".")) = \($v)"
            ' "$file")

            # Every on_x is drawn as text and icons on its x, so the pair has to be
            # legible. Accent roles in light variants are the usual offenders.
            while IFS=$'\t' read -r ratio mode fg_key bg_key fg bg; do
              [ -z "$ratio" ] && continue
              shown=$(LC_ALL=C awk -v r="$ratio" 'BEGIN { printf "%.2f", r }')
              if awk -v r="$ratio" -v f="$contrast_floor" 'BEGIN { exit !(r < f) }'; then
                check_file_title

                comment_body+=$(printf -- '\n- Illegible `%s` on `%s` in `%s`: contrast %s:1 (`%s` on `%s`), below the %s:1 floor' "$fg_key" "$bg_key" "$mode" "$shown" "$fg" "$bg" "$contrast_floor")
                issues=$((issues + 1))
              elif awk -v r="$ratio" -v w="$contrast_warn" 'BEGIN { exit !(r < w) }'; then
                check_file_title

                comment_body+=$(printf -- '\n- Low contrast `%s` on `%s` in `%s`: %s:1 (`%s` on `%s`), under %s:1' "$fg_key" "$bg_key" "$mode" "$shown" "$fg" "$bg" "$contrast_warn")
                warnings=$((warnings + 1))
              fi
            done < <(jq -r -f "$RUNNER_TEMP/contrast.jq" "$file")
          done <<<"$diff_changes"

          if [[ "$issues" -ne 0 || "$warnings" -ne 0 ]]; then
            if [[ "$warnings" -ne 0 ]]; then
              comment_body+=$(printf -- '\n\n--- \nLow-contrast pairs are a warning, not a rejection: they do not fail this check.')
            fi
            gh pr comment "$PR_NUMBER" --body "$comment_body"
          fi

          if [[ "$issues" -ne 0 ]]; then
            exit 1
          fi
